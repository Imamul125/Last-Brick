name: Upload IPA to TestFlight

on:
  workflow_dispatch:
    inputs:
      ipa_url:
        description: "Direct download link to the .ipa file (e.g. Dropbox or Google Drive)"
        required: true

jobs:
  upload:
    runs-on: macos-latest
    steps:
      - name: Download IPA
        run: |
          echo "Downloading IPA..."
          curl -L -o app.ipa "${{ github.event.inputs.ipa_url }}"

      - name: Upload to TestFlight
        env:
          APP_STORE_CONNECT_API_KEY_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          APP_STORE_CONNECT_API_KEY_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          APP_STORE_CONNECT_API_KEY_KEY: ${{ secrets.APP_STORE_CONNECT_API_KEY_CONTENT }}
        run: |
          echo "Uploading IPA using Fastlane..."
          fastlane pilot upload --ipa app.ipa --skip_waiting_for_build_processing true
